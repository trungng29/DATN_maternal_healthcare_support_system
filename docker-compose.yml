services:
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    depends_on: [gateway]
    networks: [app-network]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
      - "127.0.0.1:${KONG_MANAGER_PORT:-8002}:8002"
    depends_on:
      kong-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      doctor-service:
        condition: service_started
      sample-service:
        condition: service_started
      receptionist-service:
        condition: service_started
      patient-service: { condition: service_started }
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: "${KONG_PG_DATABASE:-kong}"
      KONG_PG_USER: "${KONG_PG_USER:-kong}"
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD:-kongpass}"
    networks: [app-network]

  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${KONG_PG_DATABASE:-kong}"
      POSTGRES_USER: "${KONG_PG_USER:-kong}"
      POSTGRES_PASSWORD: "${KONG_PG_PASSWORD:-kongpass}"
    volumes: [kong-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  kong-init:
    build: { context: ., dockerfile: gateway/Dockerfile }
    command: [/usr/local/bin/init-kong.sh]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: "${KONG_PG_DATABASE:-kong}"
      KONG_PG_USER: "${KONG_PG_USER:-kong}"
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD:-kongpass}"
      AUTH_JWT_PUBLIC_KEY: "${AUTH_JWT_PUBLIC_KEY:-}"
      AUTH_JWT_KEY_ID: "${AUTH_JWT_KEY_ID:-local-dev-key}"
    depends_on:
      kong-database: { condition: service_healthy }
    networks: [app-network]

  auth-migrate:
    build:
      context: ./services
      dockerfile: Dockerfile
      target: migrator
      args: { APP_NAME: auth-service }
    environment:
      PRISMA_SCHEMA: prisma/schema.prisma
      AUTH_DATABASE_URL: "postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-authpass}@auth-database:5432/${AUTH_DB_NAME:-auth}?schema=public"
    depends_on:
      auth-database: { condition: service_healthy }
    networks: [app-network]

  auth-service:
    build: { context: ./services, dockerfile: Dockerfile, args: { APP_NAME: auth-service } }
    ports:
      - "${AUTH_SERVICE_PORT:-5003}:5003"
    environment:
      PORT: ${AUTH_SERVICE_INTERNAL_PORT:-5003}
      AUTH_DATABASE_URL: postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-authpass}@auth-database:5432/${AUTH_DB_NAME:-auth}?schema=public
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-local-dev-key}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:-}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_PASSWORD_RESET_PEPPER: ${AUTH_PASSWORD_RESET_PEPPER:-}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-15}
      AUTH_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${AUTH_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      # Browser-facing reset URL; SMTP host must be reachable from this container.
      AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-587}
      AUTH_SMTP_SECURE: ${AUTH_SMTP_SECURE:-false}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER:-}
      AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-local-dev-internal-secret}
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    networks: [app-network]

  auth-database:
    image: postgres:16-alpine
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${AUTH_DB_NAME:-auth}"
      POSTGRES_USER: "${AUTH_DB_USER:-auth}"
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:-authpass}"
    volumes: [auth-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  # ─── Doctor Service ─────────────────────────────
  doctor-migrate:
    build:
      context: ./services
      dockerfile: Dockerfile
      target: migrator
      args:
        APP_NAME: doctor-service
    environment:
      PRISMA_SCHEMA: prisma/doctor/schema.prisma
      DOCTOR_DATABASE_URL: "postgresql://${DOCTOR_DB_USER:-doctor}:${DOCTOR_DB_PASSWORD:-doctorpass}@doctor-database:5432/${DOCTOR_DB_NAME:-doctor}?schema=public"
    depends_on:
      doctor-database:
        condition: service_healthy
    networks:
      - app-network

  doctor-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        APP_NAME: doctor-service
    ports:
      - "${DOCTOR_SERVICE_PORT:-5005}:${DOCTOR_SERVICE_INTERNAL_PORT:-5005}"
    environment:
      PORT: ${DOCTOR_SERVICE_INTERNAL_PORT:-5005}
      DOCTOR_DATABASE_URL: postgresql://${DOCTOR_DB_USER:-doctor}:${DOCTOR_DB_PASSWORD:-doctorpass}@doctor-database:5432/${DOCTOR_DB_NAME:-doctor}?schema=public
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_ACCOUNT_LOOKUP_URL: ${AUTH_ACCOUNT_LOOKUP_URL:-http://auth-service:5003/internal/accounts}
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-local-dev-internal-secret}
    depends_on:
      doctor-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    networks:
      - app-network

  doctor-database:
    image: postgres:16-alpine
    ports:
      - "${DOCTOR_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${DOCTOR_DB_NAME:-doctor}
      POSTGRES_USER: ${DOCTOR_DB_USER:-doctor}
      POSTGRES_PASSWORD: ${DOCTOR_DB_PASSWORD:-doctorpass}
    volumes:
      - doctor-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Receptionist Service owns workforce/admission-orchestration state.
  # Admission HTTP routes remain disabled until downstream API contracts exist.
  receptionist-migrate:
    build:
      context: ./services
      dockerfile: Dockerfile
      target: migrator
      args:
        APP_NAME: receptionist-service
    environment:
      PRISMA_SCHEMA: prisma/receptionist/schema.prisma
      RECEPTIONIST_DATABASE_URL: "postgresql://${RECEPTIONIST_DB_USER:-receptionist}:${RECEPTIONIST_DB_PASSWORD:-receptionistpass}@receptionist-database:5432/${RECEPTIONIST_DB_NAME:-receptionist}?schema=public"
    depends_on:
      receptionist-database:
        condition: service_healthy
    networks:
      - app-network

  receptionist-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        APP_NAME: receptionist-service
    ports:
      - "${RECEPTIONIST_SERVICE_PORT:-5006}:5006"
    environment:
      PORT: 5006
      RECEPTIONIST_DATABASE_URL: postgresql://${RECEPTIONIST_DB_USER:-receptionist}:${RECEPTIONIST_DB_PASSWORD:-receptionistpass}@receptionist-database:5432/${RECEPTIONIST_DB_NAME:-receptionist}?schema=public
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-local-dev-key}
      RECEPTION_IDEMPOTENCY_TTL_HOURS: ${RECEPTION_IDEMPOTENCY_TTL_HOURS:-24}
    depends_on:
      receptionist-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    networks:
      - app-network

  receptionist-database:
    image: postgres:16-alpine
    ports:
      - "${RECEPTIONIST_DB_PORT:-5436}:5432"
    environment:
      POSTGRES_DB: ${RECEPTIONIST_DB_NAME:-receptionist}
      POSTGRES_USER: ${RECEPTIONIST_DB_USER:-receptionist}
      POSTGRES_PASSWORD: ${RECEPTIONIST_DB_PASSWORD:-receptionistpass}
    volumes:
      - receptionist-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ─── Sample Service ──────────────────────────────
  patient-migrate:
    build:
      context: ./services
      dockerfile: Dockerfile
      target: migrator
      args: { APP_NAME: patient-service }
    environment:
      PRISMA_SCHEMA: prisma/patient/schema.prisma
      PATIENT_DATABASE_URL: "postgresql://${PATIENT_DB_USER:-patient}:${PATIENT_DB_PASSWORD:-patientpass}@patient-database:5432/${PATIENT_DB_NAME:-patient}?schema=public"
    depends_on:
      patient-database: { condition: service_healthy }
    networks: [app-network]

  patient-service:
    build: { context: ./services, dockerfile: Dockerfile, args: { APP_NAME: patient-service } }
    ports:
      - "${PATIENT_SERVICE_PORT:-5004}:5004"
    environment:
      PORT: 5004
      PATIENT_DATABASE_URL: "postgresql://${PATIENT_DB_USER:-patient}:${PATIENT_DB_PASSWORD:-patientpass}@patient-database:5432/${PATIENT_DB_NAME:-patient}?schema=public"
      AUTH_JWT_PUBLIC_KEY: "${AUTH_JWT_PUBLIC_KEY:-}"
      AUTH_JWT_KEY_ID: "${AUTH_JWT_KEY_ID:-local-dev-key}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:-maternal-healthcare-auth}"
      AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}"
      AUTH_JWKS_URL: "http://auth-service:5003/.well-known/jwks.json"
      AUTH_JWKS_CACHE_TTL_SECONDS: 300
      PATIENT_NATIONAL_ID_ENCRYPTION_KEY: "${PATIENT_NATIONAL_ID_ENCRYPTION_KEY:-}"
      PATIENT_NATIONAL_ID_LOOKUP_PEPPER: "${PATIENT_NATIONAL_ID_LOOKUP_PEPPER:-}"
      PATIENT_INTERNAL_JWT_PUBLIC_KEY: "${PATIENT_INTERNAL_JWT_PUBLIC_KEY:-}"
      PATIENT_INTERNAL_JWT_KEY_ID: "${PATIENT_INTERNAL_JWT_KEY_ID:-internal-dev-key}"
      PATIENT_INTERNAL_JWT_ISSUER: "${PATIENT_INTERNAL_JWT_ISSUER:-maternal-healthcare-internal}"
      PATIENT_INTERNAL_JWT_AUDIENCE: "${PATIENT_INTERNAL_JWT_AUDIENCE:-patient-service}"
    depends_on:
      patient-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:5004/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app-network]

  patient-database:
    image: postgres:16-alpine
    ports:
      - "${PATIENT_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: "${PATIENT_DB_NAME:-patient}"
      POSTGRES_USER: "${PATIENT_DB_USER:-patient}"
      POSTGRES_PASSWORD: "${PATIENT_DB_PASSWORD:-patientpass}"
    volumes: [patient-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]

  sample-service:
    build: { context: ./services, dockerfile: Dockerfile, args: { APP_NAME: sample-service } }
    ports:
      - "${SAMPLE_SERVICE_PORT:-5001}:5000"
    environment: { PORT: 5000 }
    networks: [app-network]

networks:
  app-network: { driver: bridge }
volumes:
  kong-data:
  auth-data:
  receptionist-data:
  doctor-data:
  patient-data: {}
