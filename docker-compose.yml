# Docker Compose — Multi-container orchestration cho Hệ thống Chăm sóc sức khỏe Thai sản
# Cấu trúc: NPM Workspaces Monorepo

services:
  # ==========================================
  # Infrastructure (Cơ sở hạ tầng)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: mhss-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-mhss_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mhss-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-mhss_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mhss-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - mhss-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mhss-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - mhss-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # API Gateway
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: mhss-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - medical-record-service
      - billing-service
      - appointment-service
      - queue-service
      - consultation-service
      - notification-service
      - audit-log-service
    networks:
      - mhss-network

  # ==========================================
  # Microservices
  # ==========================================
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: mhss-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mhss-network

  patient-service:
    build:
      context: .
      dockerfile: ./services/patient-service/Dockerfile
    container_name: mhss-patient-service
    ports:
      - "${PATIENT_SERVICE_PORT:-3002}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mhss-network

  doctor-service:
    build:
      context: .
      dockerfile: ./services/doctor-service/Dockerfile
    container_name: mhss-doctor-service
    ports:
      - "${DOCTOR_SERVICE_PORT:-3003}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mhss-network

  medical-record-service:
    build:
      context: .
      dockerfile: ./services/medical-record-service/Dockerfile
    container_name: mhss-medical-record-service
    ports:
      - "${MEDICAL_RECORD_SERVICE_PORT:-3004}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mhss-network

  billing-service:
    build:
      context: .
      dockerfile: ./services/billing-service/Dockerfile
    container_name: mhss-billing-service
    ports:
      - "${BILLING_SERVICE_PORT:-3005}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mhss-network

  appointment-service:
    build:
      context: .
      dockerfile: ./services/appointment-service/Dockerfile
    container_name: mhss-appointment-service
    ports:
      - "${APPOINTMENT_SERVICE_PORT:-3006}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mhss-network

  queue-service:
    build:
      context: .
      dockerfile: ./services/queue-service/Dockerfile
    container_name: mhss-queue-service
    ports:
      - "${QUEUE_SERVICE_PORT:-3007}:3000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mhss-network

  consultation-service:
    build:
      context: .
      dockerfile: ./services/consultation-service/Dockerfile
    container_name: mhss-consultation-service
    ports:
      - "${CONSULTATION_SERVICE_PORT:-3008}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mhss-network

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: mhss-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3009}:3000"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mhss-network

  audit-log-service:
    build:
      context: .
      dockerfile: ./services/audit-log-service/Dockerfile
    container_name: mhss-audit-log-service
    ports:
      - "${AUDIT_LOG_SERVICE_PORT:-3010}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mhss-network

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      # dockerfile: Dockerfile
    container_name: mhss-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    networks:
      - mhss-network

# ==========================================
# Networks & Volumes
# ==========================================
networks:
  mhss-network:
    driver: bridge

volumes:
  db-data:
