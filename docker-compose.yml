name: maternal-healthcare-support-system
networks:
  app-network:
    driver: bridge
    external: false
    name: maternal-healthcare-support-system_app-network
services:
  appointment-database:
    environment:
      POSTGRES_DB: ${APPOINTMENT_DB_NAME:-appointment}
      POSTGRES_PASSWORD: ${APPOINTMENT_DB_PASSWORD:-appointmentpass}
      POSTGRES_USER: ${APPOINTMENT_DB_USER:-appointment}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "5438"
        target: 5432
    volumes:
      - source: appointment-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  appointment-migrate:
    build:
      args:
        APP_NAME: appointment-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      appointment-database:
        condition: service_healthy
        required: true
    environment:
      APPOINTMENT_DATABASE_URL: postgresql://${APPOINTMENT_DB_USER:-appointment}:${APPOINTMENT_DB_PASSWORD:-appointmentpass}@appointment-database:5432/${APPOINTMENT_DB_NAME:-appointment}?schema=public
      PRISMA_SCHEMA: prisma/appointment/schema.prisma
    networks:
      app-network: null
  appointment-service:
    build:
      args:
        APP_NAME: appointment-service
      context: ./services
      dockerfile: Dockerfile
    depends_on:
      appointment-migrate:
        condition: service_completed_successfully
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      APPOINTMENT_DATABASE_URL: postgresql://${APPOINTMENT_DB_USER:-appointment}:${APPOINTMENT_DB_PASSWORD:-appointmentpass}@appointment-database:5432/${APPOINTMENT_DB_NAME:-appointment}?schema=public
      APPOINTMENT_GRPC_TARGET: appointment-service:6008
      AUTH_GRPC_TARGET: auth-service:6003
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      BILLING_GRPC_TARGET: billing-service:6009
      CATALOG_GRPC_TARGET: service-catalog-service:6007
      DOCTOR_GRPC_TARGET: doctor-service:6005
      GRPC_PORT: 6008
      INTERNAL_SERVICE_JWT_AUDIENCE: appointment-service
      INTERNAL_SERVICE_JWT_ISSUER: ${INTERNAL_SERVICE_JWT_ISSUER:-maternal-healthcare-internal}
      INTERNAL_SERVICE_JWT_KEY_ID: ${INTERNAL_SERVICE_JWT_KEY_ID:-internal-dev-key}
      INTERNAL_SERVICE_JWT_PRIVATE_KEY: ${INTERNAL_SERVICE_JWT_PRIVATE_KEY:-}
      INTERNAL_SERVICE_JWT_PUBLIC_KEY: ${INTERNAL_SERVICE_JWT_PUBLIC_KEY:-}
      MEDICAL_RECORD_GRPC_TARGET: medical-record-service:6011
      PATIENT_GRPC_TARGET: patient-service:6004
      PORT: 5008
      QUEUE_GRPC_TARGET: queue-service:6012
      RABBITMQ_DOMAIN_EXCHANGE: maternal.domain.v1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-maternal}:${RABBITMQ_PASSWORD:-maternalpass}@rabbitmq:5672
      SERVICE_ID: appointment-service
    networks:
      app-network: null
    ports:
      - ${APPOINTMENT_SERVICE_PORT:-5008}:5008
  audit-log-database:
    environment:
      POSTGRES_DB: ${AUDIT_LOG_DB_NAME:-audit_log}
      POSTGRES_PASSWORD: ${AUDIT_LOG_DB_PASSWORD:-audit_logpass}
      POSTGRES_USER: ${AUDIT_LOG_DB_USER:-audit_log}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "5446"
        target: 5432
    volumes:
      - source: audit-log-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  audit-log-migrate:
    build:
      args:
        APP_NAME: audit-log-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      audit-log-database:
        condition: service_healthy
        required: true
    environment:
      AUDIT_LOG_DATABASE_URL: postgresql://${AUDIT_LOG_DB_USER:-audit_log}:${AUDIT_LOG_DB_PASSWORD:-audit_logpass}@audit-log-database:5432/${AUDIT_LOG_DB_NAME:-audit_log}?schema=public
      PRISMA_SCHEMA: prisma/audit-log/schema.prisma
    networks:
      app-network: null
  audit-log-service:
    build:
      args:
        APP_NAME: audit-log-service
      context: ./services
      dockerfile: Dockerfile
    depends_on:
      audit-log-migrate:
        condition: service_completed_successfully
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      APPOINTMENT_GRPC_TARGET: appointment-service:6008
      AUDIT_LOG_DATABASE_URL: postgresql://${AUDIT_LOG_DB_USER:-audit_log}:${AUDIT_LOG_DB_PASSWORD:-audit_logpass}@audit-log-database:5432/${AUDIT_LOG_DB_NAME:-audit_log}?schema=public
      AUTH_GRPC_TARGET: auth-service:6003
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      BILLING_GRPC_TARGET: billing-service:6009
      CATALOG_GRPC_TARGET: service-catalog-service:6007
      DOCTOR_GRPC_TARGET: doctor-service:6005
      GRPC_PORT: 6017
      INTERNAL_SERVICE_JWT_AUDIENCE: audit-log-service
      INTERNAL_SERVICE_JWT_ISSUER: ${INTERNAL_SERVICE_JWT_ISSUER:-maternal-healthcare-internal}
      INTERNAL_SERVICE_JWT_KEY_ID: ${INTERNAL_SERVICE_JWT_KEY_ID:-internal-dev-key}
      INTERNAL_SERVICE_JWT_PRIVATE_KEY: ${INTERNAL_SERVICE_JWT_PRIVATE_KEY:-}
      INTERNAL_SERVICE_JWT_PUBLIC_KEY: ${INTERNAL_SERVICE_JWT_PUBLIC_KEY:-}
      MEDICAL_RECORD_GRPC_TARGET: medical-record-service:6011
      PATIENT_GRPC_TARGET: patient-service:6004
      PORT: 5017
      QUEUE_GRPC_TARGET: queue-service:6012
      RABBITMQ_DOMAIN_EXCHANGE: maternal.domain.v1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-maternal}:${RABBITMQ_PASSWORD:-maternalpass}@rabbitmq:5672
      SERVICE_ID: audit-log-service
    networks:
      app-network: null
    ports:
      - ${AUDIT_LOG_SERVICE_PORT:-5017}:5017
  auth-database:
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - ${AUTH_DB_PORT:-5433}:5432
    volumes:
      - source: auth-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  auth-migrate:
    build:
      args:
        APP_NAME: auth-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      auth-database:
        condition: service_healthy
        required: true
    environment:
      AUTH_DATABASE_URL: postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-authpass}@auth-database:5432/${AUTH_DB_NAME:-auth}?schema=public
      PRISMA_SCHEMA: prisma/schema.prisma
    networks:
      app-network: null
  auth-service:
    build:
      args:
        APP_NAME: auth-service
      context: ./services
      dockerfile: Dockerfile
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      - AUTH_ACCESS_TOKEN_TTL_SECONDS=${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      - AUTH_DATABASE_URL=postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-authpass}@auth-database:5432/${AUTH_DB_NAME:-auth}?schema=public
      - AUTH_EMAIL_FROM=${AUTH_EMAIL_FROM:-}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      - AUTH_JWT_KEY_ID=${AUTH_JWT_KEY_ID:-local-dev-key}
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:-}
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:-}
      - AUTH_PASSWORD_RESET_PEPPER=${AUTH_PASSWORD_RESET_PEPPER:-}
      - AUTH_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS=${AUTH_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      - AUTH_PASSWORD_RESET_TTL_MINUTES=${AUTH_PASSWORD_RESET_TTL_MINUTES:-15}
      - AUTH_PASSWORD_RESET_URL=${AUTH_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      - AUTH_EMAIL_VERIFICATION_URL=${AUTH_EMAIL_VERIFICATION_URL:-http://localhost:3000/xac-minh-email}
      - AUTH_REFRESH_TOKEN_PEPPER=${AUTH_REFRESH_TOKEN_PEPPER:-}
      - AUTH_REFRESH_TOKEN_TTL_DAYS=${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      - AUTH_SMTP_HOST=${AUTH_SMTP_HOST:-}
      - AUTH_SMTP_PASSWORD=${AUTH_SMTP_PASSWORD:-}
      - AUTH_SMTP_PORT=${AUTH_SMTP_PORT:-587}
      - AUTH_SMTP_SECURE=${AUTH_SMTP_SECURE:-false}
      - AUTH_SMTP_USER=${AUTH_SMTP_USER:-}
      - GRPC_PORT=6003
      - INTERNAL_SERVICE_AUTH_SECRET=${INTERNAL_SERVICE_AUTH_SECRET:-local-dev-internal-secret}
      - INTERNAL_SERVICE_JWT_AUDIENCE=auth-service
      - INTERNAL_SERVICE_JWT_ISSUER=${INTERNAL_SERVICE_JWT_ISSUER:-maternal-healthcare-internal}
      - INTERNAL_SERVICE_JWT_KEY_ID=${INTERNAL_SERVICE_JWT_KEY_ID:-internal-dev-key}
      - INTERNAL_SERVICE_JWT_PRIVATE_KEY=${INTERNAL_SERVICE_JWT_PRIVATE_KEY:-}
      - INTERNAL_SERVICE_JWT_PUBLIC_KEY=${INTERNAL_SERVICE_JWT_PUBLIC_KEY:-}
      - PORT=${AUTH_SERVICE_INTERNAL_PORT:-5003}
      - SERVICE_ID=auth-service
    networks:
      app-network: null
    ports:
      - ${AUTH_SERVICE_PORT:-5003}:5003
  billing-database:
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME:-billing}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:-billingpass}
      POSTGRES_USER: ${BILLING_DB_USER:-billing}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "5439"
        target: 5432
    volumes:
      - source: billing-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  billing-migrate:
    build:
      args:
        APP_NAME: billing-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      billing-database:
        condition: service_healthy
        required: true
    environment:
      BILLING_DATABASE_URL: postgresql://${BILLING_DB_USER:-billing}:${BILLING_DB_PASSWORD:-billingpass}@billing-database:5432/${BILLING_DB_NAME:-billing}?schema=public
      PRISMA_SCHEMA: prisma/billing/schema.prisma
    networks:
      app-network: null
  billing-service:
    build:
      args:
        APP_NAME: billing-service
      context: ./services
      dockerfile: Dockerfile
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      APPOINTMENT_GRPC_TARGET: appointment-service:6008
      AUTH_GRPC_TARGET: auth-service:6003
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      BILLING_DATABASE_URL: postgresql://${BILLING_DB_USER:-billing}:${BILLING_DB_PASSWORD:-billingpass}@billing-database:5432/${BILLING_DB_NAME:-billing}?schema=public
      BILLING_GRPC_TARGET: billing-service:6009
      CATALOG_GRPC_TARGET: service-catalog-service:6007
      DOCTOR_GRPC_TARGET: doctor-service:6005
      GRPC_PORT: 6009
      INTERNAL_SERVICE_JWT_AUDIENCE: billing-service
      INTERNAL_SERVICE_JWT_ISSUER: ${INTERNAL_SERVICE_JWT_ISSUER:-maternal-healthcare-internal}
      INTERNAL_SERVICE_JWT_KEY_ID: ${INTERNAL_SERVICE_JWT_KEY_ID:-internal-dev-key}
      INTERNAL_SERVICE_JWT_PRIVATE_KEY: ${INTERNAL_SERVICE_JWT_PRIVATE_KEY:-}
      INTERNAL_SERVICE_JWT_PUBLIC_KEY: ${INTERNAL_SERVICE_JWT_PUBLIC_KEY:-}
      MEDICAL_RECORD_GRPC_TARGET: medical-record-service:6011
      PATIENT_GRPC_TARGET: patient-service:6004
      PORT: 5009
      QUEUE_GRPC_TARGET: queue-service:6012
      RABBITMQ_DOMAIN_EXCHANGE: maternal.domain.v1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-maternal}:${RABBITMQ_PASSWORD:-maternalpass}@rabbitmq:5672
      SERVICE_ID: billing-service
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/vnpay/return}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
    networks:
      app-network: null
    ports:
      - ${BILLING_SERVICE_PORT:-5009}:5009
  catalog-database:
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalogpass}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - ${CATALOG_DB_PORT:-5437}:5432
    volumes:
      - source: catalog-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  catalog-migrate:
    build:
      args:
        APP_NAME: service-catalog-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      catalog-database:
        condition: service_healthy
        required: true
    environment:
      CATALOG_DATABASE_URL: postgresql://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalogpass}@catalog-database:5432/${CATALOG_DB_NAME:-catalog}?schema=public
      PRISMA_SCHEMA: prisma/catalog/schema.prisma
    networks:
      app-network: null
  consultation-database:
    environment:
      POSTGRES_DB: ${CONSULTATION_DB_NAME:-consultation}
      POSTGRES_PASSWORD: ${CONSULTATION_DB_PASSWORD:-consultationpass}
      POSTGRES_USER: ${CONSULTATION_DB_USER:-consultation}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:16-alpine
    networks:
      app-network: null
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
