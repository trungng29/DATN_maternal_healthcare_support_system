    volumes:
      - source: doctor-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  doctor-migrate:
    build:
      args:
        APP_NAME: doctor-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      doctor-database:
        condition: service_healthy
        required: true
    environment:
      DOCTOR_DATABASE_URL: postgresql://${DOCTOR_DB_USER:-doctor}:${DOCTOR_DB_PASSWORD:-doctorpass}@doctor-database:5432/${DOCTOR_DB_NAME:-doctor}?schema=public
