# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
  # ─── Frontend ────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    networks:
      - app-network

  # ─── API Gateway ─────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
      # The Kong Admin API is intentionally available only from this machine.
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
      # Kong Manager is intentionally available only from this machine.
      - "127.0.0.1:${KONG_MANAGER_PORT:-8002}:8002"
    depends_on:
      kong-init:
        condition: service_completed_successfully
      service-a:
        condition: service_started
      service-b:
        condition: service_started
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    networks:
      - app-network

  # Kong's PostgreSQL data store. It is internal-only and persisted in kong-data.
  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    volumes:
      - kong-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Initializes a new Kong database and imports docs/api-specs/kong.yml once.
  kong-init:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["/usr/local/bin/init-kong.sh"]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - app-network

  # ─── Service A ───────────────────────────────────
  service-a:
    build: ./services/service-a
    ports:
      - "${SERVICE_A_PORT:-5001}:5000"
    env_file:
      - .env
    networks:
      - app-network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # ─── Service B ───────────────────────────────────
  service-b:
    build: ./services/service-b
    ports:
      - "${SERVICE_B_PORT:-5002}:5000"
    env_file:
      - .env
    networks:
      - app-network

  # ─── Shared Infrastructure (uncomment as needed) ─
  # db:
  #   image: postgres:16-alpine    # or mysql:8, mongo:7, etc.
  #   ports:
  #     - "${DB_PORT:-5432}:5432"
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-mydb}
  #     POSTGRES_USER: ${DB_USER:-admin}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   networks:
  #     - app-network

  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - app-network

  # rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  kong-data:
