    networks:
      app-network: null
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "5442"
        target: 5432
    volumes:
      - source: document-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  document-migrate:
    build:
      args:
        APP_NAME: document-service
      context: ./services
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      document-database:
        condition: service_healthy
        required: true
    environment:
      DOCUMENT_DATABASE_URL: postgresql://${DOCUMENT_DB_USER:-document}:${DOCUMENT_DB_PASSWORD:-documentpass}@document-database:5432/${DOCUMENT_DB_NAME:-document}?schema=public
      PRISMA_SCHEMA: prisma/document/schema.prisma
    networks:
      app-network: null
  document-service:
    build:
      args:
        APP_NAME: document-service
      context: ./services
      dockerfile: Dockerfile
    depends_on:
