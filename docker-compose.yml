  doctor-service:
    build:
      args:
        APP_NAME: doctor-service
      context: ./services
      dockerfile: Dockerfile
    depends_on:
      auth-service:
        condition: service_started
        required: true
      doctor-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      - AUTH_ACCOUNT_LOOKUP_URL=${AUTH_ACCOUNT_LOOKUP_URL:-http://auth-service:5003/internal/accounts}
      - AUTH_GRPC_TARGET=auth-service:6003
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-maternal-healthcare-api}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-maternal-healthcare-auth}
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:-}
      - DOCTOR_DATABASE_URL=postgresql://${DOCTOR_DB_USER:-doctor}:${DOCTOR_DB_PASSWORD:-doctorpass}@doctor-database:5432/${DOCTOR_DB_NAME:-doctor}?schema=public
      - GRPC_PORT=6005
      - INTERNAL_SERVICE_AUTH_SECRET=${INTERNAL_SERVICE_AUTH_SECRET:-local-dev-internal-secret}
      - INTERNAL_SERVICE_JWT_AUDIENCE=doctor-service
      - INTERNAL_SERVICE_JWT_ISSUER=${INTERNAL_SERVICE_JWT_ISSUER:-maternal-healthcare-internal}
      - INTERNAL_SERVICE_JWT_KEY_ID=${INTERNAL_SERVICE_JWT_KEY_ID:-internal-dev-key}
      - INTERNAL_SERVICE_JWT_PRIVATE_KEY=${INTERNAL_SERVICE_JWT_PRIVATE_KEY:-}
      - INTERNAL_SERVICE_JWT_PUBLIC_KEY=${INTERNAL_SERVICE_JWT_PUBLIC_KEY:-}
      - PORT=${DOCTOR_SERVICE_INTERNAL_PORT:-5005}
      - SERVICE_ID=doctor-service
    networks:
      app-network: null
    ports:
      - ${DOCTOR_SERVICE_PORT:-5005}:${DOCTOR_SERVICE_INTERNAL_PORT:-5005}
  document-database:
