openapi: 3.0.3
info:
  title: Maternal Appointment Service API
  version: 1.0.0
  description: Public REST contract for appointment search, five-minute slot holds, booking, and staff-managed appointment changes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Slots
  - name: Appointments
paths:
  /bookable-slots:
    get:
      tags: [Slots]
      operationId: listBookableSlots
      summary: Search bookable slots
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: selectionMode
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SelectionMode'
        - name: requestedDoctorId
          in: query
          schema:
            type: string
            format: uuid
        - name: requestedRankCode
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: pageToken
          in: query
          schema:
            type: string
            maxLength: 500
      responses:
        '200':
          description: Bookable slots. Rank searches expose capacity but do not promise a doctor until a hold is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableSlotPage'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /slot-holds:
    post:
      tags: [Slots]
      operationId: createSlotHold
      summary: Atomically hold one concrete doctor slot for exactly 300 seconds
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSlotHoldRequest'
      responses:
        '201':
          description: Hold created. It is active only while server time is strictly before expiresAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotHold'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /slot-holds/{holdId}:
    delete:
      tags: [Slots]
      operationId: releaseSlotHold
      summary: Release an owned hold
      description: Desired-state idempotent. Releasing an already released or expired owned hold succeeds.
      parameters:
        - $ref: '#/components/parameters/HoldId'
      responses:
        '204':
          description: Hold is no longer active.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments:
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book an appointment by consuming an active hold
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment booked. No queue ticket or queue number is created by this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List appointments visible to the caller
      parameters:
        - name: patientId
          in: query
          description: Staff filter. For a patient caller the service derives identity from JWT and rejects or ignores a client actor identifier.
          schema:
            type: string
            format: uuid
        - name: assignedDoctorId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: pageToken
          in: query
          schema:
            type: string
            maxLength: 500
      responses:
        '200':
          description: Cursor-paginated appointments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPage'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /appointments/{id}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: Get one appointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Appointment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AppointmentNotFound'}
  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: Cancel before check-in
      description: Receptionist or Admin only; patients cannot self-cancel.
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
      responses:
        '200':
          description: Cancelled appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AppointmentNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/reschedule:
    post:
      tags: [Appointments]
      operationId: rescheduleAppointment
      summary: Atomically consume a new hold and release the old occupancy
      description: Receptionist or Admin only. Pricing is resolved again and a new immutable snapshot revision is stored.
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequest'
      responses:
        '200':
          description: Rescheduled appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AppointmentNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /appointments/{id}/reassign:
    post:
      tags: [Appointments]
      operationId: reassignAppointment
      summary: Confirm a staff-managed doctor reassignment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignAppointmentRequest'
      responses:
        '200':
          description: Reassigned appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AppointmentNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued for the public API audience.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: VALIDATION_FAILED, message: Request validation failed, requestId: req-123}
    Unauthenticated:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Authentication is required, requestId: req-123}
    Forbidden:
      description: Permission, ownership, or role rule failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: FORBIDDEN, message: Access is denied, requestId: req-123}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: RESOURCE_NOT_FOUND, message: Resource was not found, requestId: req-123}
    AppointmentNotFound:
      description: Appointment not found. Wrong-owner patient access is also concealed as not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: APPOINTMENT_NOT_FOUND, message: Appointment was not found, requestId: req-123}
    Conflict:
      description: Slot/hold conflict, reused idempotency key, invalid state transition, or version conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            slotUnavailable:
              value: {code: SLOT_NOT_AVAILABLE, message: The slot is no longer available, requestId: req-123}
            holdExpired:
              value: {code: HOLD_EXPIRED, message: The slot hold has expired, requestId: req-123}
            keyReused:
              value: {code: IDEMPOTENCY_KEY_REUSED, message: The key was already used for a different request, requestId: req-123}
            invalidState:
              value: {code: INVALID_STATE_TRANSITION, message: The operation is not valid in the current state, requestId: req-123}
    Unprocessable:
      description: Semantically invalid doctor, service, rank, pricing, or payment condition.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            doctor:
              value: {code: DOCTOR_NOT_ELIGIBLE, message: Doctor is not eligible for the full interval, requestId: req-123}
            service:
              value: {code: SERVICE_NOT_BOOKABLE, message: Service cannot be booked, requestId: req-123}
            rank:
              value: {code: RANK_NOT_AVAILABLE, message: No exact-rank doctor is available, requestId: req-123}
            payment:
              value: {code: PAYMENT_CONDITION_NOT_MET, message: Admission payment condition is not met, requestId: req-123}
    DependencyUnavailable:
      description: A required downstream dependency is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: DEPENDENCY_UNAVAILABLE, message: A required dependency is unavailable, requestId: req-123}
  schemas:
    SelectionMode:
      type: string
      enum: [DOCTOR, RANK]
    BookingChannel:
      type: string
      enum: [ONLINE, RECEPTION, WALK_IN]
    AppointmentStatus:
      type: string
      enum: [BOOKED, REASSIGNMENT_REQUIRED, CHECKED_IN, IN_CLINICAL_CARE, COMPLETED, CANCELLED, NO_SHOW]
    HoldStatus:
      type: string
      enum: [ACTIVE, CONSUMED, EXPIRED, RELEASED]
    BookableSlot:
      type: object
      required: [serviceId, selectionMode, rankCode, startAt, endAt, availableCapacity]
      properties:
        serviceId: {type: string, format: uuid}
        selectionMode: {$ref: '#/components/schemas/SelectionMode'}
        doctorId:
          type: string
          format: uuid
          nullable: true
          description: Present for DOCTOR search; rank search does not promise a doctor before hold creation.
        rankCode: {type: string, minLength: 1, maxLength: 50}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        availableCapacity: {type: integer, minimum: 1}
    BookableSlotPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BookableSlot'}
        nextPageToken: {type: string, nullable: true}
    CreateSlotHoldRequest:
      type: object
      required: [serviceId, selectionMode, startAt, endAt]
      properties:
        patientId:
          type: string
          format: uuid
          description: Required for staff booking; patient identity is derived from JWT for patient calls.
        serviceId: {type: string, format: uuid}
        selectionMode: {$ref: '#/components/schemas/SelectionMode'}
        requestedDoctorId: {type: string, format: uuid}
        requestedRankCode: {type: string, minLength: 1, maxLength: 50}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
      description: Exactly one of requestedDoctorId or requestedRankCode is required and must match selectionMode.
    SlotHold:
      type: object
      required: [id, patientId, serviceId, doctorId, rankCode, selectionMode, startAt, endAt, status, expiresAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        patientId: {type: string, format: uuid}
        serviceId: {type: string, format: uuid}
        doctorId: {type: string, format: uuid}
        rankCode: {type: string, maxLength: 50}
        selectionMode: {$ref: '#/components/schemas/SelectionMode'}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/HoldStatus'}
        expiresAt:
          type: string
          format: date-time
          description: Exactly createdAt plus 300 seconds according to the database clock.
        createdAt: {type: string, format: date-time}
    CreateAppointmentRequest:
      type: object
      required: [holdId, channel]
      properties:
        holdId: {type: string, format: uuid}
        channel: {$ref: '#/components/schemas/BookingChannel'}
    PricingSnapshot:
      type: object
      required: [serviceName, serviceVersion, basePriceId, baseAmountMinor, rankSurchargeAmountMinor, estimatedTotalMinor, currency]
      properties:
        serviceName: {type: string, maxLength: 200}
        serviceVersion: {type: integer, format: int64, minimum: 1}
        basePriceId: {type: string, format: uuid}
        baseAmountMinor: {type: integer, format: int64, minimum: 0}
        rankSurchargePriceId: {type: string, format: uuid, nullable: true}
        rankSurchargeAmountMinor: {type: integer, format: int64, minimum: 0}
        estimatedTotalMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, enum: [VND]}
    Appointment:
      type: object
      required: [id, appointmentCode, patientId, serviceId, channel, selectionMode, assignedDoctorId, assignedRankCode, specialtyId, startAt, endAt, status, pricing, rescheduleCount, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        appointmentCode: {type: string, maxLength: 20, pattern: '^[A-Z0-9]+$'}
        patientId: {type: string, format: uuid}
        serviceId: {type: string, format: uuid}
        channel: {$ref: '#/components/schemas/BookingChannel'}
        selectionMode: {$ref: '#/components/schemas/SelectionMode'}
        requestedDoctorId: {type: string, format: uuid, nullable: true}
        requestedRankCode: {type: string, maxLength: 50, nullable: true}
        assignedDoctorId: {type: string, format: uuid}
        assignedRankCode: {type: string, maxLength: 50}
        specialtyId: {type: string, format: uuid}
        availabilityVersion: {type: integer, format: int64, minimum: 1}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/AppointmentStatus'}
        pricing: {$ref: '#/components/schemas/PricingSnapshot'}
        queueEstimateMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: Non-authoritative estimate; this is not a queue number or ticket.
        receptionCaseId: {type: string, format: uuid, nullable: true}
        encounterId: {type: string, format: uuid, nullable: true}
        checkedInAt: {type: string, format: date-time, nullable: true}
        clinicalStartedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        cancellationReason: {type: string, nullable: true, maxLength: 500}
        rescheduleCount: {type: integer, minimum: 0}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AppointmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Appointment'}
        nextPageToken: {type: string, nullable: true}
    CancelAppointmentRequest:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
        reasonCode: {type: string, minLength: 1, maxLength: 50}
        expectedVersion: {type: integer, format: int64, minimum: 1}
    RescheduleAppointmentRequest:
      type: object
      required: [newHoldId, reason, expectedVersion]
      properties:
        newHoldId: {type: string, format: uuid}
        reason: {type: string, minLength: 3, maxLength: 500}
        reasonCode: {type: string, minLength: 1, maxLength: 50}
        expectedVersion: {type: integer, format: int64, minimum: 1}
    ReassignAppointmentRequest:
      type: object
      required: [doctorId, reason, confirmationEvidence, expectedVersion]
      properties:
        doctorId: {type: string, format: uuid}
        reason: {type: string, minLength: 3, maxLength: 500}
        reasonCode: {type: string, minLength: 1, maxLength: 50}
        confirmationEvidence: {type: string, minLength: 1, maxLength: 500}
        expectedVersion: {type: integer, format: int64, minimum: 1}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field: {type: string}
        issue: {type: string}
