# ============================================
# Auth Service — OpenAPI 3.0 Specification
# Docs: https://swagger.io/specification/
# ============================================
openapi: 3.0.3
info:
  title: Auth Service API
  description: |
    API specification for the Authentication Service.
    Provides registration, login, token refresh, logout, password management, and session lookup.
  version: 1.0.0

servers:
  - url: http://localhost:5003
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      summary: Register a new account
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '409':
          description: Account already exists

  /auth/login:
    post:
      summary: Log in with credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
        '403':
          description: Refresh token revoked

  /auth/logout:
    post:
      summary: Log out and revoke session
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          description: Invalid session

  /auth/forgot-password:
    post:
      summary: Request password reset instructions
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted without revealing account existence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Invalid request
        '429':
          description: Too many requests

  /auth/reset-password:
    post:
      summary: Reset a password using a one-time token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset and refresh sessions revoked
        '400':
          description: Invalid request or invalid/expired reset token
        '429':
          description: Too many requests

  /auth/change-password:
    post:
      summary: Change the current authenticated account password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and refresh sessions revoked
        '400':
          description: Invalid request or new password matches current password
        '401':
          description: Invalid access token, account, or current password
        '429':
          description: Too many requests

  /auth/me:
    get:
      summary: Get current session information
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized

  /internal/accounts/{accountId}:
    get:
      summary: Internal account lookup for trusted services
      operationId: internalAccountLookup
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-internal-service-secret
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account status and selected role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAccountLookupResponse'
        '403':
          description: Invalid internal service secret
        '404':
          description: Account not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    InternalAccountLookupResponse:
      type: object
      required:
        - accountId
        - status
        - role
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, LOCKED, DISABLED, PENDING_VERIFICATION]
        role:
          type: string
          enum: [PATIENT, RECEPTIONIST, DOCTOR, NURSE, ADMIN]

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
      description: Public registration always creates a PATIENT account. Staff/admin roles must be assigned through an admin-only flow.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ForgotPasswordResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: If an eligible account exists, password reset instructions will be sent.
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
        newPassword:
          type: string
          format: password
          minLength: 8
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/CurrentUserResponse'
    CurrentUserResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          example: patient
