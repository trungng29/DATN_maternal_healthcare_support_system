_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:5003
    routes:
      - name: auth-forgot-password-route
        paths: [/auth/forgot-password]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              policy: local
      - name: auth-reset-password-route
        paths: [/auth/reset-password]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: auth-change-password-route
        paths: [/auth/change-password]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: auth-service-route
        paths: [/auth]
        strip_path: false
      - name: auth-service-health-route
        paths: [/health]
        strip_path: false
      - name: auth-service-jwks-route
        paths: [/.well-known]
        strip_path: false

  - name: doctor-service
    url: http://doctor-service:5005
    routes:
      - name: doctor-service-route
        paths: [/api/doctors]
        strip_path: true

  - name: receptionist-service
    url: http://receptionist-service:5006/receptionists
    routes:
      - name: receptionist-operations-route
        paths: [/api/receptionists]
        strip_path: true

  - name: patient-service
    url: http://patient-service:5004/patients
    routes:
      - name: patient-service-route
        paths: [/api/patients]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: kid
          run_on_preflight: false
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  - name: sample-service
    url: http://sample-service:5000
    routes:
      - name: sample-service-route
        paths: [/api/sample-service]
        strip_path: true

plugins:
  - name: cors
    config:
      origins: [http://localhost:3000]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type, Idempotency-Key, X-Request-Id]
      exposed_headers: [X-Request-Id]
      credentials: true
      max_age: 3600
