openapi: 3.0.3
info: { title: Treatment Plan Service API, version: 1.0.0 }
servers: [ { url: 'http://localhost:8080/api/treatment-plans' } ]
security: [ { bearerAuth: [] } ]
paths:
  /:
    post:
      operationId: createTreatmentPlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlan' } } } }
      responses: { '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }, '403': { $ref: '#/components/responses/Error' } }
    get:
      operationId: listTreatmentPlans
      parameters:
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - { name: pregnancyEpisodeId, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: Authorized plans, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } } } } }
  /{planId}:
    parameters: [ { $ref: '#/components/parameters/PlanId' } ]
    get:
      operationId: getTreatmentPlan
      responses: { '200': { description: Plan, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      operationId: updateTreatmentPlan
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePlan' } } } }
      responses: { '200': { description: Updated/versioned, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }, '409': { $ref: '#/components/responses/Error' } }
  /{planId}/activate:
    post:
      operationId: activateTreatmentPlan
      parameters: [ { $ref: '#/components/parameters/PlanId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }, '422': { $ref: '#/components/responses/Error' } }
  /{planId}/complete:
    post:
      operationId: completeTreatmentPlan
      parameters: [ { $ref: '#/components/parameters/PlanId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } } }
  /{planId}/cancel:
    post:
      operationId: cancelTreatmentPlan
      parameters: [ { $ref: '#/components/parameters/PlanId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CancelRequest' } } } }
      responses: { '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } } }
  /{planId}/items/{itemId}/complete:
    post:
      operationId: completeTreatmentPlanItem
      parameters:
        - { $ref: '#/components/parameters/PlanId' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses: { '200': { description: Item completed, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    PlanId: { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
  schemas:
    PlanItem:
      type: object
      additionalProperties: false
      required: [type, title, description]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        type: { type: string, enum: [GOAL, CARE_INSTRUCTION, FOLLOW_UP, MONITORING] }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        dueAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED], readOnly: true }
    CreatePlan:
      type: object
      additionalProperties: false
      required: [patientId, sourceEncounterId, title, summary, effectiveFrom, items]
      properties:
        patientId: { type: string, format: uuid }
        pregnancyEpisodeId: { type: string, format: uuid, nullable: true }
        sourceEncounterId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 4000 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PlanItem' } }
    UpdatePlan:
      allOf:
        - $ref: '#/components/schemas/CreatePlan'
        - type: object
          required: [version, changeReason]
          properties: { version: { type: integer, minimum: 1 }, changeReason: { type: string, minLength: 3, maxLength: 500 } }
    VersionRequest: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
    CancelRequest: { type: object, required: [version, reason], properties: { version: { type: integer, minimum: 1 }, reason: { type: string, minLength: 3, maxLength: 500 } } }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        pregnancyEpisodeId: { type: string, format: uuid, nullable: true }
        sourceEncounterId: { type: string, format: uuid }
        authorDoctorId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED] }
        title: { type: string }
        summary: { type: string }
        version: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/PlanItem' } }
    Envelope: { type: object, properties: { data: { $ref: '#/components/schemas/Plan' } } }
    Error: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, requestId: { type: string } } } } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
