syntax = "proto3";
package maternal.medical_record.v1;
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service MedicalRecordInternalService {
  rpc OpenOrGetEncounter(OpenOrGetEncounterRequest) returns (OpenOrGetEncounterResponse);
  rpc GetEncounterSummary(GetEncounterSummaryRequest) returns (EncounterSummary);
  rpc ValidateEncounterAccess(ValidateEncounterAccessRequest) returns (ValidateEncounterAccessResponse);
  rpc LinkExternalClinicalResource(LinkExternalClinicalResourceRequest) returns (EncounterSummary);
  rpc GetPregnancyEpisodeContext(GetPregnancyEpisodeContextRequest) returns (PregnancyEpisodeContext);
}

enum EncounterState {
  ENCOUNTER_STATE_UNSPECIFIED = 0;
  ENCOUNTER_STATE_DRAFT = 1;
  ENCOUNTER_STATE_IN_PROGRESS = 2;
  ENCOUNTER_STATE_AWAITING_RESULTS = 3;
  ENCOUNTER_STATE_READY_FOR_REVIEW = 4;
  ENCOUNTER_STATE_FINALIZED = 5;
}
message AdmissionSnapshot { string reception_case_id = 1; string invoice_id = 2; string payment_condition = 3; google.protobuf.Timestamp checked_in_at = 4; }
message OpenOrGetEncounterRequest { maternal.common.v1.RequestContext context = 1; string appointment_id = 2; string patient_id = 3; string primary_doctor_id = 4; AdmissionSnapshot admission = 5; }
message OpenOrGetEncounterResponse { EncounterSummary encounter = 1; bool created = 2; bool idempotent_replay = 3; }
message GetEncounterSummaryRequest { maternal.common.v1.RequestContext context = 1; string encounter_id = 2; string appointment_id = 3; }
message EncounterSummary { string encounter_id = 1; string appointment_id = 2; string patient_id = 3; string pregnancy_episode_id = 4; string primary_doctor_id = 5; EncounterState state = 6; int64 version = 7; google.protobuf.Timestamp started_at = 8; google.protobuf.Timestamp finalized_at = 9; }
message ValidateEncounterAccessRequest { maternal.common.v1.RequestContext context = 1; string encounter_id = 2; string patient_id = 3; string doctor_id = 4; string requested_action = 5; string purpose = 6; }
message ValidateEncounterAccessResponse { bool allowed = 1; string denial_code = 2; EncounterSummary encounter = 3; string assignment_role = 4; }
message LinkExternalClinicalResourceRequest { maternal.common.v1.RequestContext context = 1; string encounter_id = 2; string resource_type = 3; string resource_id = 4; int64 expected_version = 5; }
message GetPregnancyEpisodeContextRequest { maternal.common.v1.RequestContext context = 1; string patient_id = 2; string pregnancy_episode_id = 3; }
message PregnancyEpisodeContext { string pregnancy_episode_id = 1; string patient_id = 2; string status = 3; string risk_level = 4; string estimated_due_date = 5; int64 version = 6; }
