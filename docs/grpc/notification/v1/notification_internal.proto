syntax = "proto3";

package maternal.notification.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.maternal.notification.v1";
option java_outer_classname = "NotificationInternalProto";

// RabbitMQ is the command ingress. This read-only synchronous service deliberately
// has no Send/Create notification RPC, preserving delivery-only ownership.
service NotificationInternalService {
  rpc GetDeliveryStatus(GetDeliveryStatusRequest) returns (GetDeliveryStatusResponse);
  rpc ListRecipientDeliveries(ListRecipientDeliveriesRequest) returns (ListRecipientDeliveriesResponse);
}

enum DeliveryChannel {
  DELIVERY_CHANNEL_UNSPECIFIED = 0;
  DELIVERY_CHANNEL_IN_APP = 1;
  DELIVERY_CHANNEL_EMAIL = 2;
  DELIVERY_CHANNEL_SMS = 3;
  DELIVERY_CHANNEL_PUSH = 4;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_STATUS_PENDING = 1;
  DELIVERY_STATUS_PROCESSING = 2;
  DELIVERY_STATUS_DELIVERED = 3;
  DELIVERY_STATUS_FAILED = 4;
  DELIVERY_STATUS_DEAD_LETTERED = 5;
}

message GetDeliveryStatusRequest {
  oneof lookup {
    string notification_id = 1;
    string event_id = 2;
  }
  string requester_service = 3;
  string correlation_id = 4;
}

message GetDeliveryStatusResponse {
  repeated NotificationDelivery deliveries = 1;
}

message ListRecipientDeliveriesRequest {
  string recipient_id = 1;
  optional DeliveryChannel channel = 2;
  optional DeliveryStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
  string requester_service = 6;
  string correlation_id = 7;
}

message ListRecipientDeliveriesResponse {
  repeated NotificationDelivery deliveries = 1;
  PageMetadata page = 2;
}

// Contract for notification request messages consumed from RabbitMQ. It is not
// accepted over synchronous gRPC or the public HTTP API.
message NotificationRequestedEvent {
  string event_id = 1;
  string event_type = 2;
  string aggregate_id = 3;
  string recipient_id = 4;
  string template_code = 5;
  repeated DeliveryChannel channels = 6;
  map<string, string> template_variables = 7;
  map<string, string> metadata = 8;
  google.protobuf.Timestamp occurred_at = 9;
  string correlation_id = 10;
  int32 schema_version = 11;
}

message NotificationDelivery {
  string id = 1;
  string event_id = 2;
  string recipient_id = 3;
  DeliveryChannel channel = 4;
  DeliveryStatus status = 5;
  string template_code = 6;
  string provider_message_id = 7;
  string failure_code = 8;
  string failure_message = 9;
  int32 attempt_count = 10;
  google.protobuf.Timestamp next_attempt_at = 11;
  google.protobuf.Timestamp delivered_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string correlation_id = 15;
}

message PageMetadata {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_items = 3;
  int32 total_pages = 4;
}
