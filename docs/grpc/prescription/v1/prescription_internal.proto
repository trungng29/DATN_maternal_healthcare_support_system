syntax = "proto3";
package maternal.prescription.v1;
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";
service PrescriptionInternalService {
  rpc CreateDraftPrescription(CreateDraftPrescriptionRequest) returns (PrescriptionView);
  rpc GetPrescription(GetPrescriptionRequest) returns (PrescriptionView);
  rpc ListPrescriptionsByEncounter(ListPrescriptionsByEncounterRequest) returns (ListPrescriptionsResponse);
  rpc IssuePrescription(IssuePrescriptionRequest) returns (PrescriptionView);
  rpc CancelPrescription(CancelPrescriptionRequest) returns (PrescriptionView);
  rpc ValidatePrescriptionReference(ValidatePrescriptionReferenceRequest) returns (ValidatePrescriptionReferenceResponse);
}
message PrescriptionItemInput { string medication_code = 1; string medication_name = 2; string strength = 3; string dosage_form = 4; string route = 5; string dose = 6; string frequency = 7; int32 duration_days = 8; string instruction = 9; }
message CreateDraftPrescriptionRequest { maternal.common.v1.RequestContext context = 1; string idempotency_key = 2; string encounter_id = 3; string patient_id = 4; string pregnancy_episode_id = 5; string doctor_id = 6; repeated PrescriptionItemInput items = 7; }
message GetPrescriptionRequest { maternal.common.v1.RequestContext context = 1; string prescription_id = 2; }
message ListPrescriptionsByEncounterRequest { maternal.common.v1.RequestContext context = 1; string encounter_id = 2; }
message ListPrescriptionsResponse { repeated PrescriptionView prescriptions = 1; }
message IssuePrescriptionRequest { maternal.common.v1.RequestContext context = 1; string idempotency_key = 2; string prescription_id = 3; int32 expected_version = 4; }
message CancelPrescriptionRequest { maternal.common.v1.RequestContext context = 1; string idempotency_key = 2; string prescription_id = 3; int32 expected_version = 4; string reason = 5; }
message ValidatePrescriptionReferenceRequest { maternal.common.v1.RequestContext context = 1; string prescription_id = 2; string encounter_id = 3; string patient_id = 4; }
message ValidatePrescriptionReferenceResponse { bool valid = 1; string status = 2; }
message PrescriptionView { string prescription_id = 1; string encounter_id = 2; string patient_id = 3; string doctor_id = 4; string status = 5; int32 version = 6; repeated PrescriptionItemInput items = 7; google.protobuf.Timestamp issued_at = 8; google.protobuf.Timestamp cancelled_at = 9; }
